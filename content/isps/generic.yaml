# Generic fix steps. Actions only: the card already explains the problem. No menu
# paths here; those vary by router and live in the ISP files' `howto`.
name: your internet provider
asns: []

steps:
  router_admin_exposed:
    - Sign in to your router's settings from home (the address is usually on the router's label).
    - Turn off "Remote management", "Remote administration" or "Web access from WAN".
    - If you can't find it, ask your internet provider to turn it off.
  telnet:
    - Turn off Telnet or "remote access" in your router or device settings.
    - If you didn't set it up, update the router's firmware and change its admin password.
  tr069:
    - Update your router's firmware.
    - Ask your internet provider whether port 7547 should be open, and for a newer router if yours is old.
  smb:
    - Remove any port-forwarding rule for port 445.
    - If a NAS or PC is set as the "DMZ host", turn DMZ off.
  rdp:
    - Remove the port-forwarding rule for port 3389.
    - For remote access, use a VPN or a remote-access app instead.
  upnp_wan:
    - Update your router's firmware.
    - Turn off UPnP if you don't need it. If the router gets no updates, replace it.
  natpmp:
    - Update your router's firmware and turn off NAT-PMP and UPnP if you don't need them.
  open_port:
    - If you didn't set this up, remove the matching port-forwarding rule.
    - If you did, keep the device updated and use a strong password.
  adb:
    - On the device, turn off "USB debugging", "ADB debugging" or "Network debugging" in Developer options.
    - Remove any port-forwarding rule for port 5555. Replace unbranded TV boxes that don't get updates.
  vnc:
    - Turn off screen sharing (VNC), or remove its port-forwarding rule.
    - For remote access, use a VPN or a remote-access app with two-factor login.
  camera_dvr:
    - Update the camera or recorder and give it a long, unique password.
    - Remove its port-forwarding rule and view it through the manufacturer's app or a VPN instead.
  router_service:
    - Update your router's firmware.
    - Turn off remote management, or ask your provider to. Replace the router if it no longer gets updates.
  printer:
    - Remove the printer's port-forwarding rule and update its firmware.
  open_resolver:
    - Turn off any router option that offers DNS on the internet (WAN) side, and update its firmware.
    - If you can't find it, ask your internet provider.
  history_vulns:
    - Update your router and anything you've exposed to the internet (cameras, NAS, servers).
    - Remove port-forwarding rules you don't need.
  dns_suspicious:
    - Set the router's DNS back to automatic, or to a known service like 1.1.1.1 or 9.9.9.9.
    - Change the router's admin password and update its firmware.
  reputation_suspicious:
    - Update every device, run a malware scan on your computers, and restart the router.
    - Change your Wi-Fi password so unknown devices drop off.
